name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Windows runner 的 stdout 默认是 cp1252，脚本里任何中文 print 都会抛
# UnicodeEncodeError。v1.0.0 / v1.0.1 的构建全挂在这里。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- 必须通过的部分：纯逻辑，不碰 Qt ----
      - name: Logic test (no Qt)
        run: python tests/logic_test.py

      - name: End-to-end test (local mock API, no Qt)
        run: python tests/mock_api_test.py

      # ---- 尽力而为的部分 ----
      # v1.0.0 / v1.0.1 的构建挂在这里，真因是 stdout 编码（cp1252）导致中文 print 抛异常，
      # 上面已经用 PYTHONIOENCODING 修掉。既然根因不是 Qt，这步本该能过；
      # 但为了让 Release 不被 headless 环境的偶发问题挡住，先保留 best-effort，
      # 等连续几次都绿了再把 continue-on-error 去掉。
      - name: GUI smoke test (offscreen)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler -u tests/smoke.py

      - name: Qt diagnostics (best effort)
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Write-Host "stdout encoding check:"
          python -u -c "import sys; print(sys.stdout.encoding, sys.flags.utf8_mode)"
          Write-Host "QT_QPA_PLATFORM=$env:QT_QPA_PLATFORM"
          Write-Host "QT_PLUGIN_PATH=$env:QT_PLUGIN_PATH"
          Write-Host "QTDIR=$env:QTDIR"
          python -u -c "import PySide6, os; print('PySide6', PySide6.__version__); print('plugins', os.path.join(os.path.dirname(PySide6.__file__), 'plugins'))"
          python -u -X faulthandler -c "from PySide6.QtWidgets import QApplication; a = QApplication([]); print('QApplication OK')"

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        shell: pwsh
        run: ./build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizCopilot-windows-x64
          path: dist/QuizCopilot.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QuizCopilot.exe
          generate_release_notes: true
