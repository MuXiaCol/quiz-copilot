name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- 必须通过的部分：纯逻辑，不碰 Qt ----
      - name: Logic test (no Qt)
        run: python tests/logic_test.py

      - name: End-to-end test (local mock API, no Qt)
        run: python tests/mock_api_test.py

      # ---- 尽力而为的部分 ----
      # windows-latest 是 headless 环境，Qt 平台插件有概率直接 abort（进程级退出，
      # 连 traceback 都没有）。这跟产品本身无关，所以不让它挡住发布，
      # 但仍然会跑、失败仍然会在 Actions 里标红。
      - name: GUI smoke test (offscreen, best effort)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler -u tests/smoke.py

      - name: Qt diagnostics (best effort)
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Write-Host "QT_QPA_PLATFORM=$env:QT_QPA_PLATFORM"
          Write-Host "QT_PLUGIN_PATH=$env:QT_PLUGIN_PATH"
          Write-Host "QTDIR=$env:QTDIR"
          python -u -c "import PySide6, os; print('PySide6', PySide6.__version__); print('plugins', os.path.join(os.path.dirname(PySide6.__file__), 'plugins'))"
          python -u -X faulthandler -c "from PySide6.QtWidgets import QApplication; a = QApplication([]); print('QApplication OK')"

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        shell: pwsh
        run: ./build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizCopilot-windows-x64
          path: dist/QuizCopilot.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QuizCopilot.exe
          generate_release_notes: true
